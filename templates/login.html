<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Login - Secure Authentication</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" onerror="this.onerror=null; this.href='/static/style.css';">
    </head>
    <body>
        <div class="login-container">
            <h2>Welcome !!</h2>
            <p class="subtitle">Please enter your details to sign in</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>
        <script src="{{ url_for('static', filename='script.js') }}" onerror="this.onerror=null; this.src='/static/script.js';"></script>
    </body>
</html>
